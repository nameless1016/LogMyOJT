{% if messages %}
<div class="messages-container" role="region" aria-label="Notifications">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}">
      <span class="alert-text">{{ message }}</span>
      <button type="button" class="alert-close" aria-label="Dismiss alert" onclick="this.closest('.alert').remove();">&times;</button>
    </div>
  {% endfor %}
</div>
{% endif %}
