{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile · LogMyOJT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/profile/profile.css' %}">
</head>
<body>
<div class="profile-page">
    <div class="top-bar">
        <span class="brand-mark">LOG·MY·OJT</span>
        <div class="top-bar-nav">
            <a href="{% url 'home:home' %}">Home</a>
            <a href="{% url 'profile:profile' %}" class="active">Profile</a>
            <a href="{% url 'user_settings:settings' %}">Settings</a>
            <form method="post" action="{% url 'login:logout' %}" style="margin:0;">
                {% csrf_token %}
                <a href="#" onclick="this.closest('form').submit(); return false;">Log out</a>
            </form>
        </div>
    </div>
    <div class="profile-body">
        <div class="profile-card">
            <h2>Your profile</h2>
            <p class="sub">This is how you'll appear on approval requests sent to your supervisor.</p>

            <div class="avatar-preview">
                {% if profile.profile_image %}
                    <img id="avatar-preview-img" src="{{ profile.profile_image.url }}" alt="Profile photo">
                {% else %}
                    <img id="avatar-preview-img" style="display:none;" alt="Profile photo">
                    <span>{{ request.user.username|slice:":1"|upper }}</span>
                {% endif %}
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="field">
                    <label for="id_full_name">Full name</label>
                    <input type="text" id="id_full_name" name="full_name" class="form-input" value="{{ profile.full_name }}" placeholder="Juan Dela Cruz">
                </div>
                <div class="field">
                    <label for="id_bio">Bio</label>
                    <textarea id="id_bio" name="bio" class="form-input" placeholder="A short line about your OJT placement...">{{ profile.bio }}</textarea>
                </div>
                <div class="field">
                    <label for="id_profile_image">Profile photo</label>
                    <input type="file" id="id_profile_image" name="profile_image" class="form-input" accept="image/*">
                </div>
                <button type="submit" class="btn-stamp">Save profile</button>
            </form>
        </div>
    </div>
</div>
<script src="{% static 'js/profile/profile.js' %}"></script>
</body>
</html>
